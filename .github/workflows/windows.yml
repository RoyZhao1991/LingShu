name: Windows

on:
  push:
    branches:
      - main
    tags:
      - "windows-v*"
    paths:
      - "WindowsApp/**"
      - "Runtime/LingShuCore/**"
      - "Runtime/Grok/crates/codegen/lingshu-grok-runtime/**"
      - "Resources/DesignKB/**"
      - "Tests/LingShuMacTests/KernelABIContractTests.swift"
      - ".github/workflows/windows.yml"
  pull_request:
    branches:
      - main
    paths:
      - "WindowsApp/**"
      - "Runtime/LingShuCore/**"
      - "Runtime/Grok/crates/codegen/lingshu-grok-runtime/**"
      - "Resources/DesignKB/**"
      - "Tests/LingShuMacTests/KernelABIContractTests.swift"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installers
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            WindowsApp/package-lock.json
            Resources/DesignKB/pptxgenjs/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Windows release version consistency
        run: |
          $package = Get-Content WindowsApp/package.json -Raw | ConvertFrom-Json
          $packageLock = Get-Content WindowsApp/package-lock.json -Raw | ConvertFrom-Json
          $lockRoot = $packageLock.packages.PSObject.Properties |
            Where-Object Name -eq "" |
            Select-Object -First 1 -ExpandProperty Value
          $tauri = Get-Content WindowsApp/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargoToml = Get-Content WindowsApp/src-tauri/Cargo.toml -Raw
          $cargoLock = Get-Content WindowsApp/src-tauri/Cargo.lock -Raw
          $cargoTomlMatch = [regex]::Match($cargoToml, '(?m)^version = "([^"]+)"')
          $cargoLockMatch = [regex]::Match(
            $cargoLock,
            '(?ms)\[\[package\]\]\s+name = "lingshu-windows"\s+version = "([^"]+)"'
          )
          if (-not $cargoTomlMatch.Success -or -not $cargoLockMatch.Success -or $null -eq $lockRoot) {
            throw "Could not read every Windows application version field."
          }
          $expected = $package.version
          $versions = [ordered]@{
            "package-lock root" = $packageLock.version
            "package-lock application" = $lockRoot.version
            "Cargo.toml" = $cargoTomlMatch.Groups[1].Value
            "Cargo.lock" = $cargoLockMatch.Groups[1].Value
            "tauri.conf.json" = $tauri.version
          }
          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $expected) {
              throw "$($entry.Key) version '$($entry.Value)' does not match package.json '$expected'."
            }
          }
          Write-Host "Verified Windows version $expected in all five release manifests."

      - name: Set up Python for the bundled DesignKB generator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: WindowsApp
        run: npm ci

      - name: Build and verify the self-contained PptxGenJS generator
        working-directory: Resources/DesignKB/pptxgenjs
        run: |
          npm ci
          npm run build:windows
          $helper = Join-Path $env:GITHUB_WORKSPACE "Resources/DesignKB/bin/designkb-pptxgenjs.exe"
          $smokeInput = Join-Path $env:GITHUB_WORKSPACE "Resources/DesignKB/pptxgenjs/smoke-input.json"
          $smokeOutput = Join-Path $env:RUNNER_TEMP "designkb-pptxgenjs-smoke.pptx"
          if (-not (Test-Path $helper)) {
            throw "The self-contained PptxGenJS generator was not produced."
          }
          & $helper $smokeInput $smokeOutput (Join-Path $env:GITHUB_WORKSPACE "Resources/DesignKB")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeOutput) -or (Get-Item $smokeOutput).Length -lt 10000) {
            throw "The bundled PptxGenJS generator failed its real PowerPoint smoke test."
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($smokeOutput)
          try {
            $slides = @($archive.Entries | Where-Object { $_.FullName -match '^ppt/slides/slide[0-9]+\.xml$' })
            if ($slides.Count -ne 6) {
              throw "Expected 6 slides from the PptxGenJS smoke test; found $($slides.Count)."
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Bundled PptxGenJS generator: $helper"

      - name: Build the compatible Python DesignKB generator
        run: |
          python -m pip install --disable-pip-version-check python-pptx pillow pyinstaller
          $bin = Join-Path $env:GITHUB_WORKSPACE "Resources/DesignKB/bin"
          $work = Join-Path $env:RUNNER_TEMP "designkb-pyinstaller"
          $spec = Join-Path $env:RUNNER_TEMP "designkb-spec"
          New-Item -ItemType Directory -Force -Path $bin, $work, $spec | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --name designkb-generator --distpath $bin --workpath $work --specpath $spec Resources/DesignKB/generator.py
          $helper = Join-Path $bin "designkb-generator.exe"
          if (-not (Test-Path $helper)) {
            throw "The self-contained DesignKB generator was not produced."
          }
          $smokeInput = Join-Path $env:RUNNER_TEMP "designkb-smoke.json"
          $smokeOutput = Join-Path $env:RUNNER_TEMP "designkb-smoke.pptx"
          @{
            title = "DesignKB Windows smoke test"
            theme = "midnight"
            slides = @(
              @{
                layout = "cover"
                title = "DesignKB Windows smoke test"
                subtitle = "Bundled generator verified"
              }
            )
          } | ConvertTo-Json -Depth 8 | Set-Content -Path $smokeInput -Encoding utf8
          & $helper $smokeInput $smokeOutput (Join-Path $env:GITHUB_WORKSPACE "Resources/DesignKB")
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeOutput) -or (Get-Item $smokeOutput).Length -lt 1000) {
            throw "The bundled DesignKB generator failed its real PowerPoint smoke test."
          }
          Write-Host "Bundled DesignKB generator: $helper"

      - name: Verify shared runtime kernel
        run: |
          cargo fmt --manifest-path Runtime/LingShuCore/Cargo.toml -- --check
          cargo test --manifest-path Runtime/LingShuCore/Cargo.toml -- --test-threads=1

      - name: Verify real DesignKB and installed plugin execution
        run: cargo test --manifest-path Runtime/LingShuCore/Cargo.toml -- --ignored --test-threads=1

      - name: Verify full-access public HTTPS through shared runtime
        run: cargo test --manifest-path Runtime/LingShuCore/Cargo.toml engine::tests::full_access_permits_public_https_on_windows -- --ignored --exact

      - name: Verify frontend
        working-directory: WindowsApp
        run: |
          npm test
          npm run build

      - name: Build MSI and NSIS installers
        working-directory: WindowsApp
        run: npm run tauri -- build

      - name: Verify release executable uses the Windows GUI subsystem
        run: |
          $executable = Join-Path $env:GITHUB_WORKSPACE "WindowsApp/src-tauri/target/release/lingshu-windows.exe"
          if (-not (Test-Path $executable)) {
            throw "The release executable was not produced: $executable"
          }
          $stream = [System.IO.File]::OpenRead($executable)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $optionalHeaderOffset = $peOffset + 24
            $stream.Position = $optionalHeaderOffset
            $magic = $reader.ReadUInt16()
            if ($magic -ne 0x10b -and $magic -ne 0x20b) {
              throw "Unexpected PE optional-header magic: 0x$($magic.ToString('x'))"
            }
            $stream.Position = $optionalHeaderOffset + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "Expected WINDOWS_GUI subsystem (2), found $subsystem. The app would open a console window."
            }
          } finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          Write-Host "Verified WINDOWS_GUI subsystem for $executable"

      - name: Collect installers and checksums
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "WindowsApp/src-tauri/target/release/bundle"
          $output = Join-Path $env:GITHUB_WORKSPACE "dist/windows"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE "WindowsApp/package.json") -Raw | ConvertFrom-Json).version
          $msiInstallers = @(Get-ChildItem -Path $bundle -Recurse -File | Where-Object { $_.Extension -eq ".msi" })
          $nsisInstallers = @(Get-ChildItem -Path $bundle -Recurse -File | Where-Object { $_.Name -like "*-setup.exe" })
          $expectedMsiNames = @(
            "Nous_${version}_x64_en-US.msi",
            "Nous_${version}_x64_zh-CN.msi"
          )
          $actualMsiNames = @($msiInstallers | ForEach-Object Name)
          $missingMsiNames = @($expectedMsiNames | Where-Object { $_ -notin $actualMsiNames })
          if ($missingMsiNames.Count -gt 0 -or $nsisInstallers.Count -ne 1) {
            throw "Expected MSI installers '$($expectedMsiNames -join ', ')' and exactly one NSIS installer. Missing MSI: '$($missingMsiNames -join ', ')'; found $($nsisInstallers.Count) NSIS."
          }
          foreach ($installer in $msiInstallers | Where-Object { $_.Name -in $expectedMsiNames }) {
            Copy-Item $installer.FullName -Destination $output
          }
          Copy-Item $nsisInstallers[0].FullName -Destination (Join-Path $output "Nous-Windows-x64-Setup.exe")
          $checksumLines = @(Get-ChildItem $output -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          })
          $checksumPath = Join-Path $output "SHA256SUMS.txt"
          $checksumText = ($checksumLines -join "`n") + "`n"
          [System.IO.File]::WriteAllText($checksumPath, $checksumText, [System.Text.UTF8Encoding]::new($false))
          Get-ChildItem $output -File | Format-Table Name, Length

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Nous-Windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged Windows preview
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE "WindowsApp/package.json") -Raw | ConvertFrom-Json).version
          $versionMatch = [regex]::Match($version, '^(\d+\.\d+\.\d+)-(\d+)$')
          if (-not $versionMatch.Success) {
            throw "Package version '$version' does not follow the release version format."
          }
          $expectedTag = "windows-v$($versionMatch.Groups[1].Value)-preview.$($versionMatch.Groups[2].Value)"
          if ($tag -ne $expectedTag) {
            throw "Tag '$tag' does not match package version '$version'; expected '$expectedTag'."
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
          $notes = @"
          Windows x64 technical preview built and tested on GitHub's Windows runner.

          This preview fixes autonomous review loops without imposing a fixed checker revision limit. Objective, observable defects may continue through as many productive revisions as needed. Subjective visual preferences, evidence the checker cannot observe, and judgments beyond the model's capability now enter a persisted human-confirmation checkpoint instead of triggering blind regeneration. Human acceptance is bound to the exact artifact revisions that were reviewed; a changed file requires renewed confirmation. Rejected intermediate drafts stay out of the main chat response while remaining available in the execution record.

          Current and superseded artifact revisions are tracked separately, while semantic fingerprints distinguish real content, Office structure, presentation themes, and PDF visuals from renamed copies, kind aliases, or container metadata. Review baselines and repeated evidence survive adapter failures and application restarts, including alternating A/B cycles. Managed external runs use two-phase durable receipts so changed files, explicit save-as replacement claims, and final text survive a failure or restart between generation, atomic registration, independent checking, and completion. Long revision histories are compacted into deterministic state snapshots rather than growing the model context forever. Repeated or cycling tool plans that return no new evidence, together with exhausted technical recovery, stop background self-spinning and request human direction while preserving the GoalSpec, transcript, and artifacts.

          Installed release builds also launch as a native GUI application without a startup console; background PowerShell, managed loop harnesses, plugins, DesignKB generators, converters, and Git inspection continue headlessly with captured output. Debug builds may still expose a console for diagnostics.

          The release retains Full Access capability recovery, the bundled PptxGenJS and Python DesignKB engines, PDF.js preview rendering, synchronous latest-message anchoring, replaceable Loop Harness, global memory, task ledger, artifact tracking, Office Foundation for DOCX/PPTX/XLSX, document extraction, and independent checking shared by both desktop clients. Direct Windows computer control and realtime audio/video perception are not included in this preview.
          "@
          gh release create $tag --repo $env:GITHUB_REPOSITORY --prerelease --title "Nous (LingShu) Windows Technical Preview $version" --notes $notes
          }
          gh release upload $tag dist/windows/* --repo $env:GITHUB_REPOSITORY --clobber
